<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Yaci Lens: the serverless Cardano explorer. Cardano blockchain data and analytics in your browser, powered by Yaci Store, Cloudflare R2, Apache Parquet and DuckDB-WASM." />
		<meta name="theme-color" content="#0e0f12" />
		<script>
			// Apply the saved or OS theme before first paint, so there's no flash.
			(function () {
				try {
					var t = localStorage.getItem('lens:theme');
					if (t !== 'yaci' && t !== 'yaci-dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'yaci-dark' : 'yaci';
					}
					document.documentElement.setAttribute('data-theme', t);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
