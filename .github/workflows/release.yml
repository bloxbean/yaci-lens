# Releases Yaci Lens to GitHub Pages (https://lens.yaci.xyz), following the BloxBean release-ops standard.
#
#   PR: bump `version` in package.json -- code-owner review (release owners) --> merge to main
#     └─ release.yml
#          ├─ version   did `version` change in this push? (a manual run on main releases the current version)
#          ├─ approve   [env: release] a release owner approves (no secrets in this environment)
#          ├─ build     npm ci, audit signatures, check, build (the version is baked into the site)
#          └─ publish   push the site to the gh-pages branch, with the custom domain
#   GitHub's pages-build-deployment for that push --> [env: github-pages] approval --> live site
#
# Other pushes to main are built by ci.yml but not published: the site changes only with a release.
# The data is not part of the build; the site reads it from the public data URL at runtime.
name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          now=$(node -p "require('./package.json').version")
          before=$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})" || true)
          echo "version=$now" >> "$GITHUB_OUTPUT"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Releases run only from main (ref $REF)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual release of $now"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$now" != "$before" ]; then
            echo "Version changed: $before -> $now"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json changed but the version is still $now: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  approve:
    name: Approve release ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Release owners approve here. The environment holds no secrets.
    environment: release
    steps:
      - run: echo "Release $VERSION approved"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  build:
    name: Build ${{ needs.version.outputs.version }}
    needs: [version, approve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Replaces the whole gh-pages tree with the built site; .nojekyll (enable_jekyll: false) keeps the _app/ folder.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: lens.yaci.xyz
          enable_jekyll: false
          full_commit_message: Release ${{ needs.version.outputs.version }} (${{ github.sha }})

      - name: Record the pending Pages deployment
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## Yaci Lens $VERSION pushed to gh-pages - waiting for approval"
            echo
            echo "https://lens.yaci.xyz updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
